name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Derive version from tag -> app/version.py
        run: python tools/set_version.py "${{ github.ref_name }}"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build app + installer
        run: powershell -ExecutionPolicy Bypass -File installer/build-installer.ps1
      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-evo* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: installer/Output/Grabzdia-Setup-${{ steps.meta.outputs.version }}.exe
